# ==============================================================================
# SmoothSkin — Integumentary System (Skin Slot) Melee Defense Cyberware (Body-Attuned)
# ==============================================================================

$: &SmoothSkinStats
  - { tier: Common,            nextTier: SmoothSkin.SmoothSkinCommonPlus,        armor: 30,  physRes: 10, mitChance: 5,  armorPerBody: 1.0, cyberwareCost: 5  }
  - { tier: CommonPlus,        nextTier: SmoothSkin.SmoothSkinUncommon,          armor: 42,  physRes: 12, mitChance: 6,  armorPerBody: 1.1, cyberwareCost: 5  }
  - { tier: Uncommon,          nextTier: SmoothSkin.SmoothSkinUncommonPlus,      armor: 55,  physRes: 14, mitChance: 7,  armorPerBody: 1.3, cyberwareCost: 6  }
  - { tier: UncommonPlus,      nextTier: SmoothSkin.SmoothSkinRare,              armor: 68,  physRes: 16, mitChance: 8,  armorPerBody: 1.4, cyberwareCost: 6  }
  - { tier: Rare,              nextTier: SmoothSkin.SmoothSkinRarePlus,          armor: 80,  physRes: 18, mitChance: 9,  armorPerBody: 1.6, cyberwareCost: 7  }
  - { tier: RarePlus,          nextTier: SmoothSkin.SmoothSkinEpic,              armor: 92,  physRes: 20, mitChance: 10, armorPerBody: 1.7, cyberwareCost: 7  }
  - { tier: Epic,              nextTier: SmoothSkin.SmoothSkinEpicPlus,          armor: 105, physRes: 22, mitChance: 11, armorPerBody: 1.9, cyberwareCost: 8  }
  - { tier: EpicPlus,          nextTier: SmoothSkin.SmoothSkinLegendary,         armor: 118, physRes: 24, mitChance: 12, armorPerBody: 2.1, cyberwareCost: 8  }
  - { tier: Legendary,         nextTier: SmoothSkin.SmoothSkinLegendaryPlus,     armor: 130, physRes: 27, mitChance: 13, armorPerBody: 2.3, cyberwareCost: 9  }
  - { tier: LegendaryPlus,     nextTier: SmoothSkin.SmoothSkinLegendaryPlusPlus, armor: 135, physRes: 28, mitChance: 14, armorPerBody: 2.4, cyberwareCost: 9  }
  - { tier: LegendaryPlusPlus, nextTier: None,                                   armor: 140, physRes: 30, mitChance: 15, armorPerBody: 2.5, cyberwareCost: 10 }

# Humanity cost variant (2.0+ standard)
Variants.SmoothSkin$(tier)HumanityCost:
  $instances: *SmoothSkinStats
  $type: gamedataRandomVariant_Record
  weight: 1
  statModifiers:
    - $type: gamedataConstantStatModifier_Record
      value: $(cyberwareCost)
      modifierType: Additive
      statType: BaseStats.HumanityAllocated
  variantPrereqs:
    - $type: gamedataStatPrereq_Record
      comparisonType: GreaterOrEqual
      notifyOnAnyChange: False
      notifyOnlyOnStateFulfilled: False
      objectToCheck: Owner
      statType: HumanityAvailable
      valueToCheck: 0
      prereqClassName: StatPrereq
      statModifiers:
        - $type: gamedataConstantStatModifier_Record
          value: $(cyberwareCost)
          modifierType: Additive
          statType: BaseStats.GenericStatPrereqValue

SmoothSkin.SmoothSkin$(tier):
  $instances: *SmoothSkinStats
  $base: Items.MordeakTechnicaBase
  quality: Quality.$(tier)
  displayName: LocKey#mordeak_smoothskin_name
  equipArea: EquipmentArea.IntegumentarySystemCW
  cyberwareType: SubdermalArmor
  variants:
    - !append Variants.SmoothSkin$(tier)HumanityCost
  icon:
    atlasResourcePath: mordeak\mordeak_technica\ui\mordeak_technica_icon.inkatlas
    atlasPartName: smoothskin_icon
  tags: ['Cyberware', 'HideInBackpackUI', 'MordeakTechnica.SmoothSkin']
  nextUpgradeItem: $(nextTier)
  OnEquip:
    - !append
      $type: gamedataGameplayLogicPackage_Record
      stats:
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.Armor
          value: $(armor)
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.PhysicalResistance
          value: $(physRes)
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.MitigationChance
          value: $(mitChance)
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        localizedDescription: LocKey#mordeak_smoothskin_description
        floatValues: [$(armor), $(physRes), $(mitChance)]
    - !append
      $type: gamedataGameplayLogicPackage_Record
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        iconPath: UIIcon.Body
        localizedName: LocKey#mordeak_attunement_body
        localizedDescription: LocKey#mordeak_smoothskin_attunement
        floatValues: [$(armorPerBody)]
        stats:
          - BaseStats.AttunementHelper
    - !append
      $type: gamedataGameplayLogicPackage_Record
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        localizedDescription: LocKey#mordeak_smoothskin_flavor
  statModifiers:
    - !append Items.AdvancedIntegumentarySystemModule_inline0
    - !append { $type: gamedataConstantStatModifier_Record, modifierType: Additive, statType: BaseStats.Armor, value: $(armor) }
    - !append { $type: gamedataConstantStatModifier_Record, modifierType: Additive, statType: BaseStats.PhysicalResistance, value: $(physRes) }
    - !append { $type: gamedataConstantStatModifier_Record, modifierType: Additive, statType: BaseStats.MitigationChance, value: $(mitChance) }
    - !append
      $type: gamedataCombinedStatModifier_Record
      opSymbol: '*'
      refObject: Player
      refStat: BaseStats.Strength
      statType: BaseStats.Armor
      modifierType: Additive
      value: $(armorPerBody)
    - !append
      $type: gamedataCombinedStatModifier_Record
      opSymbol: '*'
      refObject: Player
      refStat: BaseStats.Strength
      statType: BaseStats.AttunementHelper
      modifierType: Additive
      value: $(armorPerBody)
