# ==============================================================================
# NeverLock — Face / Eyes Slot Cyberware (Intelligence-Attuned)
# ==============================================================================

$: &NeverLockStats
  - { tier: Common,            nextTier: NeverLock.NeverLockCommonPlus,        scanRange: 10, uploadDelay: 10, qhCrit: 5,  qhDmgPerInt: 0.005, intDisp: 0.5, cyberwareCost: 5  }
  - { tier: CommonPlus,        nextTier: NeverLock.NeverLockUncommon,          scanRange: 13, uploadDelay: 12, qhCrit: 6,  qhDmgPerInt: 0.006, intDisp: 0.6, cyberwareCost: 5  }
  - { tier: Uncommon,          nextTier: NeverLock.NeverLockUncommonPlus,      scanRange: 16, uploadDelay: 14, qhCrit: 7,  qhDmgPerInt: 0.007, intDisp: 0.7, cyberwareCost: 6  }
  - { tier: UncommonPlus,      nextTier: NeverLock.NeverLockRare,              scanRange: 20, uploadDelay: 16, qhCrit: 8,  qhDmgPerInt: 0.008, intDisp: 0.8, cyberwareCost: 6  }
  - { tier: Rare,              nextTier: NeverLock.NeverLockRarePlus,          scanRange: 24, uploadDelay: 18, qhCrit: 9,  qhDmgPerInt: 0.009, intDisp: 0.9, cyberwareCost: 7  }
  - { tier: RarePlus,          nextTier: NeverLock.NeverLockEpic,              scanRange: 28, uploadDelay: 20, qhCrit: 10, qhDmgPerInt: 0.010, intDisp: 1.0, cyberwareCost: 7  }
  - { tier: Epic,              nextTier: NeverLock.NeverLockEpicPlus,          scanRange: 32, uploadDelay: 22, qhCrit: 11, qhDmgPerInt: 0.011, intDisp: 1.1, cyberwareCost: 8  }
  - { tier: EpicPlus,          nextTier: NeverLock.NeverLockLegendary,         scanRange: 36, uploadDelay: 24, qhCrit: 12, qhDmgPerInt: 0.012, intDisp: 1.2, cyberwareCost: 8  }
  - { tier: Legendary,         nextTier: NeverLock.NeverLockLegendaryPlus,     scanRange: 40, uploadDelay: 27, qhCrit: 13, qhDmgPerInt: 0.013, intDisp: 1.3, cyberwareCost: 9  }
  - { tier: LegendaryPlus,     nextTier: NeverLock.NeverLockLegendaryPlusPlus, scanRange: 42, uploadDelay: 28, qhCrit: 14, qhDmgPerInt: 0.014, intDisp: 1.4, cyberwareCost: 9  }
  - { tier: LegendaryPlusPlus, nextTier: None,                                 scanRange: 45, uploadDelay: 30, qhCrit: 15, qhDmgPerInt: 0.015, intDisp: 1.5, cyberwareCost: 10 }

# Humanity cost variant (2.0+ standard)
Variants.NeverLock$(tier)HumanityCost:
  $instances: *NeverLockStats
  $type: gamedataRandomVariant_Record
  weight: 1
  statModifiers:
    - $type: gamedataConstantStatModifier_Record
      value: $(cyberwareCost)
      modifierType: Additive
      statType: BaseStats.HumanityAllocated
  variantPrereqs:
    - $type: gamedataStatPrereq_Record
      comparisonType: GreaterOrEqual
      notifyOnAnyChange: False
      notifyOnlyOnStateFulfilled: False
      objectToCheck: Owner
      statType: HumanityAvailable
      valueToCheck: 0
      prereqClassName: StatPrereq
      statModifiers:
        - $type: gamedataConstantStatModifier_Record
          value: $(cyberwareCost)
          modifierType: Additive
          statType: BaseStats.GenericStatPrereqValue

NeverLock.NeverLock$(tier):
  $instances: *NeverLockStats
  $base: Items.MordeakTechnicaBase
  quality: Quality.$(tier)
  displayName: LocKey#mordeak_neverlock_name
  equipArea: EquipmentArea.EyesCW
  cyberwareType: KiroshiOptics
  variants:
    - !append Variants.NeverLock$(tier)HumanityCost
  icon:
    atlasResourcePath: mordeak\mordeak_technica\ui\mordeak_technica_icon.inkatlas
    atlasPartName: neverlock_icon
  tags: ['Cyberware', 'HideInBackpackUI', 'MordeakTechnica.NeverLock', 'NVSupport']
  nextUpgradeItem: $(nextTier)
  OnEquip:
    - !append Items.AdvancedKiroshiOptics_inline2
    - !append
      $type: gamedataGameplayLogicPackage_Record
      stats:
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.CanQuickHackCriticallyHit
          value: 1
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.EnemyUploadTimeIncrease
          value: $(uploadDelay)
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        localizedDescription: LocKey#mordeak_neverlock_description
        floatValues: [$(scanRange), $(uploadDelay), $(qhCrit)]
    - !append
      $type: gamedataGameplayLogicPackage_Record
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        iconPath: UIIcon.Intelligence
        localizedName: LocKey#mordeak_attunement_intelligence
        localizedDescription: LocKey#mordeak_neverlock_attunement
        floatValues: [$(intDisp)]
        stats:
          - BaseStats.AttunementHelper
    - !append
      $type: gamedataGameplayLogicPackage_Record
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        localizedDescription: LocKey#mordeak_neverlock_flavor
  statModifiers:
    - !append Items.AdvancedFaceModule_inline0
    - !append { $type: gamedataConstantStatModifier_Record, modifierType: Additive, statType: BaseStats.CanQuickHackCriticallyHit, value: 1 }
    - !append { $type: gamedataConstantStatModifier_Record, modifierType: Additive, statType: BaseStats.EnemyUploadTimeIncrease, value: $(uploadDelay) }
    - !append
      $type: gamedataCombinedStatModifier_Record
      opSymbol: '*'
      refObject: Player
      refStat: BaseStats.Intelligence
      statType: BaseStats.BonusQuickHackDamage
      modifierType: Additive
      value: $(qhDmgPerInt)
    - !append
      $type: gamedataCombinedStatModifier_Record
      opSymbol: '*'
      refObject: Player
      refStat: BaseStats.Intelligence
      statType: BaseStats.AttunementHelper
      modifierType: Additive
      value: $(intDisp)
