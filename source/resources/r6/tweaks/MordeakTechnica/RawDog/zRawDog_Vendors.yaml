# ==============================================================================
# RawDog Vendor Distribution by District (Lore-Accurate Crooked/Black-Market Ripperdocs)
# ==============================================================================

# ------------------------------------------------------------------------------
# Westbrook: Japantown (Fingers / Finn Gerstatt)
# Lowest quality only (Common & CommonPlus) - ALWAYS available regardless of player level!
# ------------------------------------------------------------------------------
Vendors.wbr_jpn_ripperdoc_02:
  itemStock:
    - !append
      $instances:
        - { quality: Common }
        - { quality: CommonPlus }
      item: RawDog.RawDog$(quality)
      quantity:
        - Vendors.Always_Present

# ------------------------------------------------------------------------------
# Watson: Kabuki (Charles Bucks - Scavenger Chop-Shop Partner)
# Pacifica: West Wind Estate (Rony LaFleur - Lawless Combat Zone)
# Low-tier districts: Common (always available at any level) & Uncommon (level unlocked)
# ------------------------------------------------------------------------------
Vendors.$(vendor):
  $instances:
    - { vendor: wat_kab_ripperdoc_02 } # Charles Bucks (Watson - Kabuki Scav Doctor)
    - { vendor: pac_wwd_ripperdoc_01 } # Rony LaFleur (Pacifica - West Wind Estate)
  itemStock:
    - !append
      item: RawDog.RawDogCommon
      quantity:
        - Vendors.Always_Present
    - !append
      generationPrereqs:
        - LootPrereqs.UncommonCWLevelAvailabilityAtVendor
      item: RawDog.RawDogUncommon
      quantity:
        - Vendors.Always_Present

# ------------------------------------------------------------------------------
# Badlands: Nomad Outskirts (Hutch Spindler)
# Frontier salvage: Common (always available at any level), Uncommon & Rare (level unlocked)
# ------------------------------------------------------------------------------
Vendors.bls_ina_se1_ripperdoc_01: # Hutch Spindler (Badlands - Rocky Ridge / Outskirts)
  itemStock:
    - !append
      item: RawDog.RawDogCommon
      quantity:
        - Vendors.Always_Present
    - !append
      $instances:
        - { quality: Uncommon }
        - { quality: Rare }
      generationPrereqs:
        - LootPrereqs.$(quality)CWLevelAvailabilityAtVendor
      item: RawDog.RawDog$(quality)
      quantity:
        - Vendors.Always_Present

