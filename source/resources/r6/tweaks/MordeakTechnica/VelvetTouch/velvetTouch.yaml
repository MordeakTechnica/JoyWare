# Humanity cost variant (2.0+ standard)
Variants.VelvetTouch$(tier)HumanityCost:
  $instances: *VelvetTouchStats
  $type: gamedataRandomVariant_Record
  weight: 1
  statModifiers:
    - $type: gamedataConstantStatModifier_Record
      value: $(cyberwareCost)
      modifierType: Additive
      statType: BaseStats.HumanityAllocated
  variantPrereqs:
    - $type: gamedataStatPrereq_Record
      comparisonType: GreaterOrEqual
      notifyOnAnyChange: False
      notifyOnlyOnStateFulfilled: False
      objectToCheck: Owner
      statType: HumanityAvailable
      valueToCheck: 0
      prereqClassName: StatPrereq
      statModifiers:
        - $type: gamedataConstantStatModifier_Record
          value: $(cyberwareCost)
          modifierType: Additive
          statType: BaseStats.GenericStatPrereqValue

VelvetTouch.VelvetTouch$(tier):
  $instances: *VelvetTouchStats
  $base: Items.MordeakTechnicaBase
  quality: Quality.$(tier)
  displayName: LocKey#mordeak_velvettouch_name
  equipArea: EquipmentArea.HandsCW
  cyberwareType: Handle
  variants:
    - !append Variants.VelvetTouch$(tier)HumanityCost
  icon:
    atlasResourcePath: mordeak\mordeak_technica\ui\mordeak_technica_icon.inkatlas
    atlasPartName: velvet_touch_icon
  tags: ['Cyberware', 'HideInBackpackUI', 'MordeakTechnica.VelvetTouch']
  nextUpgradeItem: $(nextTier)
  OnEquip:
    - !append
      $type: gamedataGameplayLogicPackage_Record
      stats:
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.StealthHitDamageMultiplier
          value: $(stealthDmg)
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.StealthThrowingMeleeDamageIncrease
          value: $(throwingDmg)
        - $type: gamedataConstantStatModifier_Record
          modifierType: Additive
          statType: BaseStats.DetectionSpeedDecrease
          value: $(detection)
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        localizedDescription: LocKey#mordeak_velvettouch_description
        floatValues: [$(stealthDisp), $(throwingDisp), $(detectionDisp)]
    - !append
      $type: gamedataGameplayLogicPackage_Record
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        iconPath: UIIcon.Cool
        localizedName: LocKey#mordeak_attunement_cool
        localizedDescription: LocKey#mordeak_velvettouch_attunement
        floatValues: [$(coolDisp)]
        stats:
          - BaseStats.AttunementHelper
    - !append
      $type: gamedataGameplayLogicPackage_Record
      UIData:
        $type: gamedataGameplayLogicPackageUIData_Record
        localizedDescription: LocKey#mordeak_velvettouch_flavor
  statModifiers:
    - !append Items.AdvancedHandsModule_inline0
    - !append
      $type: gamedataCombinedStatModifier_Record
      opSymbol: '*'
      refObject: Player
      refStat: BaseStats.Cool
      statType: BaseStats.HeadshotDamageMultiplier
      modifierType: Additive
      value: $(headshotPerCool)
    - !append
      $type: gamedataCombinedStatModifier_Record
      opSymbol: '*'
      refObject: Player
      refStat: BaseStats.Cool
      statType: BaseStats.AttunementHelper
      modifierType: Additive
      value: $(coolDisp)
